<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Amble Engineering Works</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <i class="fas fa-cogs"></i>
                <h2>Amble Engineering</h2>
            </div>
            <h3>Reset Password</h3>
            <p>Enter your email to receive a reset code</p>
            
            <!-- Step 1: Enter Email -->
            <form id="step1-form" class="auth-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="reset-email" placeholder="your@email.com">
                </div>
                <div id="step1-error" class="form-error-banner" style="display:none;"></div>
                <button type="submit" class="btn-primary" style="width:100%;">
                    <i class="fas fa-paper-plane"></i> Send Reset Code
                </button>
            </form>
            
            <!-- Step 2: Enter Code -->
            <form id="step2-form" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label><i class="fas fa-shield-alt"></i> Reset Code</label>
                    <input type="text" id="reset-code" placeholder="Enter 6-digit code" maxlength="6">
                    <small class="field-hint">Check your email (simulation: check console/alert)</small>
                </div>
                <div id="step2-error" class="form-error-banner" style="display:none;"></div>
                <button type="submit" class="btn-primary" style="width:100%;">
                    <i class="fas fa-check"></i> Verify Code
                </button>
            </form>
            
            <!-- Step 3: New Password -->
            <form id="step3-form" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-password" placeholder="Min 6 chars, 1 letter & 1 number">
                        <button type="button" class="toggle-password" onclick="togglePassword('new-password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirm New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-confirm" placeholder="Re-enter new password">
                        <button type="button" class="toggle-password" onclick="togglePassword('new-confirm', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div id="step3-error" class="form-error-banner" style="display:none;"></div>
                <button type="submit" class="btn-primary" style="width:100%;">
                    <i class="fas fa-save"></i> Reset Password
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>
<script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let resetEmail = '';

        document.getElementById('step1-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const check = ValidationRules.email(email);
            if (!check.valid) {
                const banner = document.getElementById('step1-error');
                banner.textContent = check.message;
                banner.style.display = 'block';
                return;
            }
            
            const result = createResetToken(email);
            if (result.success) {
                resetEmail = email.trim().toLowerCase();
                document.getElementById('step1-form').style.display = 'none';
                document.getElementById('step2-form').style.display = 'block';
            } else {
                const banner = document.getElementById('step1-error');
                banner.textContent = result.message;
                banner.style.display = 'block';
            }
        });

        document.getElementById('step2-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = document.getElementById('reset-code').value;
            const result = verifyResetToken(resetEmail, code);
            if (result.valid) {
                document.getElementById('step2-form').style.display = 'none';
                document.getElementById('step3-form').style.display = 'block';
            } else {
                const banner = document.getElementById('step2-error');
                banner.textContent = result.message;
                banner.style.display = 'block';
            }
        });

        document.getElementById('step3-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('new-password').value;
            const confirm = document.getElementById('new-confirm').value;
            
            const passCheck = ValidationRules.password(pass);
            const confirmCheck = ValidationRules.confirmPassword(pass, confirm);
            
            if (!passCheck.valid) {
                const banner = document.getElementById('step3-error');
                banner.textContent = passCheck.message;
                banner.style.display = 'block';
                return;
            }
            if (!confirmCheck.valid) {
                const banner = document.getElementById('step3-error');
                banner.textContent = confirmCheck.message;
                banner.style.display = 'block';
                return;
            }
            
            const result = resetPassword(resetEmail, pass);
            if (result.success) {
                alert(result.message);
                window.location.href = 'login.html';
            } else {
                const banner = document.getElementById('step3-error');
                banner.textContent = result.message;
                banner.style.display = 'block';
            }
        });

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
