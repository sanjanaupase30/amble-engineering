<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Amble Engineering Works</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box" style="border-top:4px solid #e74c3c;">
            <div class="auth-logo">
                <i class="fas fa-user-shield" style="color:#e74c3c;"></i>
                <h2>Admin Portal</h2>
            </div>
            <h3>Shop Owner Login</h3>
            <p style="color:#e74c3c;font-size:0.85rem;"><i class="fas fa-lock"></i> Authorized personnel only</p>
            
            <form id="admin-login-form" class="auth-form">
                <div class="form-group">
                    <label><i class="fas fa-user-shield"></i> Username</label>
                    <input type="text" id="admin-user" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key"></i> Password</label>
                    <input type="password" id="admin-pass" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;background:#e74c3c;">Login as Admin</button>
            </form>
            
            <div class="auth-footer">
                <p><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a></p>
                <p style="margin-top:15px;font-size:0.8rem;color:var(--gray);">Default: admin / admin123</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('admin-user').value;
            var password = document.getElementById('admin-pass').value;
            
            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('amble_admin_session', JSON.stringify({
                    username: 'admin',
                    role: 'owner',
                    loginTime: new Date().toISOString()
                }));
                alert('Admin login successful!');
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Invalid admin credentials!');
            }
        });
    </script>
</body>
</html>
