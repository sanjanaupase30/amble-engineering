<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Amble Engineering Works</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<html class="auth-page">
    <div class="auth-container">
        <div class="auth-box" style="border-top:4px solid #e74c3c;">
            <div class="auth-logo">
                <i class="fas fa-user-shield" style="color:#e74c3c;"></i>
                <h2>Admin Portal</h2>
            </div>
            <h3>Shop Owner Login</h3>
            <p style="color:#e74c3c;font-size:0.85rem;"><i class="fas fa-lock"></i> Authorized personnel only</p>
            
            <form id="admin-login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label><i class="fas fa-user-shield"></i> Username</label>
                    <input type="text" id="admin-user" placeholder="Enter admin username" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-key"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="admin-pass" placeholder="Enter admin password" autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('admin-pass', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div id="admin-form-error" class="form-error-banner" style="display:none;"></div>
                
                <button type="submit" class="btn-primary" style="width:100%;background:#e74c3c;">
                    <i class="fas fa-sign-in-alt"></i> Login as Admin
                </button>
            </form>
            
            <div class="auth-footer">
                <p><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a></p>
            </div>
        </div>
    </div>
<script src="js/auth.js"></script>
<script>
    // Hardcoded admin bypass (keep your auth.js too)
    function loginAdmin(username, password) {
        if (username.trim() === 'admin' && password === 'admin123') {
            localStorage.setItem('amble_admin_session', JSON.stringify({ 
                username: 'admin', 
                role: 'owner', 
                loginTime: new Date().toISOString() 
            }));
            return { success: true, message: 'Admin login successful!' };
        }
        return { success: false, message: 'Invalid admin credentials!' };
    }

    function isAdminLoggedIn() {
        return JSON.parse(localStorage.getItem('amble_admin_session') || 'null') !== null;
    }

    // Redirect if already logged in
    if (isAdminLoggedIn()) {
        window.location.href = 'admin-dashboard.html';
    }

    document.getElementById('admin-login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('admin-user').value;
        const password = document.getElementById('admin-pass').value;
        
        const result = loginAdmin(username, password);
        if (result.success) {
            alert(result.message);
            window.location.href = 'admin-dashboard.html';
        } else {
            alert(result.message);
        }
    });
</script>
</html>
