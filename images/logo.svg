<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gear Icon -->
  <g transform="translate(50, 60)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#gearGrad)" stroke-width="6"/>
    <circle cx="0" cy="0" r="18" fill="#0f172a"/>
    <path d="M0,-45 L8,-35 L0,-25 L-8,-35 Z" fill="#f59e0b" transform="rotate(0)"/>
    <path d="M0,-45 L8,-35 L0,-25 L-8,-35 Z" fill="#f59e0b" transform="rotate(45)"/>
    <path d="M0,-45 L8,-35 L0,-25 L-8,-35 Z" fill="#f59e0b" transform="rotate(90)"/>
    <path d="M0,-45 L8,-35 L0,-25 L-8,-35 Z" fill="#f59e0b" transform="rotate(135)"/>
    <path d="M0,-45 L8,-35 L0,-25 L-8,-35 Z" fill="#f59e0b" transform="rotate(180)"/>
    <path d="M0,-45 L8,-35 L0,-25 L-8,-35 Z" fill="#f59e0b" transform="rotate(225)"/>
    <path d="M0,-45 L8,-35 L0,-25 L-8,-35 Z" fill="#f59e0b" transform="rotate(270)"/>
    <path d="M0,-45 L8,-35 L0,-25 L-8,-35 Z" fill="#f59e0b" transform="rotate(315)"/>
    <text x="0" y="8" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-weight="900" font-size="28">AE</text>
  </g>
  
  <!-- Company Name -->
  <text x="105" y="52" font-family="Arial, sans-serif" font-weight="800" font-size="32" fill="#0f172a" letter-spacing="1">AMBLE</text>
  <text x="105" y="78" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="3">ENGINEERING WORKS</text>
  
  <!-- Underline accent -->
  <rect x="105" y="88" width="60" height="4" fill="#f59e0b" rx="2"/>
</svg>