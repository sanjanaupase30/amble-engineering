<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Amble Engineering Works</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="container">
            <div class="logo">
    <img src="images/logo.svg" alt="Amble Engineering Works" height="45">
</div>
            <div class="admin-actions">
                <a href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> View Site</a>
                <a href="#" onclick="logoutAdmin(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </header>

    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <nav>
                <a href="#" class="admin-nav active" onclick="showAdminTab('dashboard'); return false;">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="#" class="admin-nav" onclick="showAdminTab('products'); return false;">
                    <i class="fas fa-boxes"></i> Manage Products
                </a>
                <a href="#" class="admin-nav" onclick="showAdminTab('orders'); return false;">
                    <i class="fas fa-shopping-bag"></i> Orders
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Dashboard Tab -->
            <div id="admin-dashboard" class="admin-tab active">
                <h2><i class="fas fa-tachometer-alt"></i> Dashboard Overview</h2>
                <div class="stats-cards">
                    <div class="stat-card blue">
                        <i class="fas fa-boxes"></i>
                        <div>
                            <h3 id="dash-product-count">0</h3>
                            <p>Total Products</p>
                        </div>
                    </div>
                    <div class="stat-card green">
                        <i class="fas fa-shopping-bag"></i>
                        <div>
                            <h3 id="dash-order-count">0</h3>
                            <p>Total Orders</p>
                        </div>
                    </div>
                    <div class="stat-card orange">
                        <i class="fas fa-rupee-sign"></i>
                        <div>
                            <h3 id="dash-revenue">₹0</h3>
                            <p>Total Revenue</p>
                        </div>
                    </div>
                    <div class="stat-card red">
                        <i class="fas fa-users"></i>
                        <div>
                            <h3 id="dash-user-count">0</h3>
                            <p>Registered Users</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products Tab -->
            <div id="admin-products" class="admin-tab">
                <div class="admin-section-header">
                    <h2><i class="fas fa-boxes"></i> Manage Products</h2>
                    <button class="btn-primary" onclick="toggleProductForm()"><i class="fas fa-plus"></i> Add New Product</button>
                </div>

                <!-- Add/Edit Product Form -->
                <div id="product-form-container" class="admin-form-container" style="display:none;">
                    <h3 id="form-title">Add New Product</h3>
                    <form id="product-form" class="admin-form">
                        <input type="hidden" id="edit-product-id">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Product Name</label>
                                <input type="text" id="prod-name" required>
                            </div>
                            <div class="form-group">
                                <label>Category</label>
                                <select id="prod-category" required>
                                    <option value="heavy">Heavy Machinery</option>
                                    <option value="precision">Precision Tools</option>
                                    <option value="spare">Spare Parts</option>
                                    <option value="lubrication">Lubrication Systems</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Price (₹)</label>
                                <input type="number" id="prod-price" required>
                            </div>
                            <div class="form-group">
                                <label>Old Price (₹)</label>
                                <input type="number" id="prod-oldprice" required>
                            </div>
                            <div class="form-group">
                                <label>Stock Quantity</label>
                                <input type="number" id="prod-stock" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" id="prod-image" placeholder="images/your-image.jpg">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="prod-desc" rows="3"></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Save Product</button>
                            <button type="button" class="btn-secondary" onclick="toggleProductForm()" style="border-color:var(--dark);color:var(--dark);">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Products Table -->
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products-table">
                            <!-- Filled by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="admin-orders" class="admin-tab">
                <h2><i class="fas fa-shopping-bag"></i> Customer Orders</h2>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Address</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-orders-table">
                            <!-- Filled by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
<script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Guard: Only admin can access
        if (!isAdminLoggedIn()) {
            window.location.href = 'admin-login.html';
        }

        // ===== ADMIN TABS =====
        function showAdminTab(tabName) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-nav').forEach(n => n.classList.remove('active'));
            
            document.getElementById('admin-' + tabName).classList.add('active');
            event.target.closest('.admin-nav').classList.add('active');

            if (tabName === 'products') renderAdminProducts();
            if (tabName === 'orders') renderAdminOrders();
            if (tabName === 'dashboard') updateDashboardStats();
        }

        // ===== DASHBOARD STATS =====
        function updateDashboardStats() {
            const products = getProducts();
            const orders = getOrders();
            const users = getUsers();
            
            document.getElementById('dash-product-count').textContent = products.length;
            document.getElementById('dash-order-count').textContent = orders.length;
            document.getElementById('dash-user-count').textContent = users.length;
            
            const revenue = orders.reduce((sum, o) => sum + o.total, 0);
            document.getElementById('dash-revenue').textContent = '₹' + revenue.toLocaleString();
        }

        // ===== PRODUCT FORM TOGGLE =====
        function toggleProductForm() {
            const form = document.getElementById('product-form-container');
            const isVisible = form.style.display === 'block';
            form.style.display = isVisible ? 'none' : 'block';
            
            if (isVisible) {
                document.getElementById('product-form').reset();
                document.getElementById('edit-product-id').value = '';
                document.getElementById('form-title').textContent = 'Add New Product';
            }
        }

        // ===== ADD/EDIT PRODUCT =====
        document.getElementById('product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const products = getProducts();
            const editId = document.getElementById('edit-product-id').value;
            
            const productData = {
                name: document.getElementById('prod-name').value,
                category: document.getElementById('prod-category').value,
                price: parseInt(document.getElementById('prod-price').value),
                oldPrice: parseInt(document.getElementById('prod-oldprice').value),
                stock: parseInt(document.getElementById('prod-stock').value),
                image: document.getElementById('prod-image').value || 'images/product-placeholder.jpg',
                description: document.getElementById('prod-desc').value,
                rating: 4.0
            };

            if (editId) {
                // Edit existing
                const idx = products.findIndex(p => p.id == editId);
                if (idx !== -1) {
                    products[idx] = { ...products[idx], ...productData };
                }
            } else {
                // Add new
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({ id: newId, ...productData });
            }

            saveProducts(products);
            toggleProductForm();
            renderAdminProducts();
            updateDashboardStats();
            alert(editId ? 'Product updated successfully!' : 'Product added successfully!');
        });

        // ===== RENDER ADMIN PRODUCTS =====
        function renderAdminProducts() {
            const products = getProducts();
            const tbody = document.getElementById('admin-products-table');
            
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>#${p.id}</td>
                    <td><img src="${p.image}" style="width:50px;height:50px;object-fit:cover;border-radius:4px;" onerror="this.src='images/product-placeholder.jpg'"></td>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="badge badge-${p.category}">${p.category}</span></td>
                    <td>₹${p.price.toLocaleString()}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button class="admin-btn edit" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
                        <button class="admin-btn delete" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function editProduct(id) {
            const products = getProducts();
            const p = products.find(prod => prod.id === id);
            if (!p) return;

            document.getElementById('edit-product-id').value = p.id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-category').value = p.category;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-oldprice').value = p.oldPrice;
            document.getElementById('prod-stock').value = p.stock;
            document.getElementById('prod-image').value = p.image;
            document.getElementById('prod-desc').value = p.description || '';
            
            document.getElementById('form-title').textContent = 'Edit Product';
            document.getElementById('product-form-container').style.display = 'block';
            window.scrollTo(0, document.getElementById('product-form-container').offsetTop);
        }

        function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            let products = getProducts();
            products = products.filter(p => p.id !== id);
            saveProducts(products);
            renderAdminProducts();
            updateDashboardStats();
        }

        // ===== RENDER ADMIN ORDERS =====
        function renderAdminOrders() {
            const orders = getOrders();
            const tbody = document.getElementById('admin-orders-table');
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;">No orders yet</td></tr>';
                return;
            }

            tbody.innerHTML = orders.sort((a,b) => new Date(b.orderDate) - new Date(a.orderDate)).map(o => `
                <tr>
                    <td><strong>${o.id}</strong></td>
                    <td>${o.userName}<br><small style="color:var(--gray);">${o.userEmail}</small></td>
                    <td>${o.items.length} item(s)</td>
                    <td>₹${o.total.toLocaleString()}</td>
                    <td>${o.deliveryAddress.city}, ${o.deliveryAddress.pincode}</td>
                    <td>${new Date(o.orderDate).toLocaleDateString('en-IN')}</td>
                    <td><span class="status-badge status-${o.status.toLowerCase()}">${o.status}</span></td>
                    <td>
                        <select onchange="updateOrderStatus('${o.id}', this.value)" style="padding:5px;border-radius:4px;border:1px solid #ddd;">
                            <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                            <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                            <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        function updateOrderStatus(orderId, newStatus) {
            const orders = getOrders();
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                saveOrders(orders);
                alert(`Order ${orderId} status updated to ${newStatus}`);
            }
        }

        // Init
        updateDashboardStats();
        renderAdminProducts();
    </script>
</body>
</html>
