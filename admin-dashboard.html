    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        if (!isAdminLoggedIn()) {
            window.location.href = 'admin-login.html';
        }

        function showAdminTab(tabName) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-nav').forEach(n => n.classList.remove('active'));
            document.getElementById('admin-' + tabName).classList.add('active');
            if (event && event.target) event.target.closest('.admin-nav').classList.add('active');
            if (tabName === 'products') renderAdminProducts();
            if (tabName === 'orders') renderAdminOrders();
            if (tabName === 'dashboard') updateDashboardStats();
        }

        async function updateDashboardStats() {
            try {
                const products = await ProductAPI.getAll();
                const orders = await OrderAPI.getAll();
                document.getElementById('dash-product-count').textContent = products.length;
                document.getElementById('dash-order-count').textContent = orders.length;
                const revenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
                document.getElementById('dash-revenue').textContent = '₹' + revenue.toLocaleString();
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        function toggleProductForm() {
            const form = document.getElementById('product-form-container');
            const visible = form.style.display === 'block';
            form.style.display = visible ? 'none' : 'block';
            if (visible) {
                document.getElementById('product-form').reset();
                document.getElementById('edit-product-id').value = '';
                document.getElementById('form-title').textContent = 'Add New Product';
            }
        }

        document.getElementById('product-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-product-id').value;
            const productData = {
                name: document.getElementById('prod-name').value,
                category: document.getElementById('prod-category').value,
                price: parseInt(document.getElementById('prod-price').value),
                old_price: parseInt(document.getElementById('prod-oldprice').value),
                stock: parseInt(document.getElementById('prod-stock').value),
                image: document.getElementById('prod-image').value || 'images/product-placeholder.jpg',
                description: document.getElementById('prod-desc').value,
                rating: 4.0
            };

            try {
                if (editId) {
                    await ProductAPI.update(editId, productData);
                    alert('Product updated!');
                } else {
                    await ProductAPI.add(productData);
                    alert('Product added!');
                }
                toggleProductForm();
                renderAdminProducts();
                updateDashboardStats();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        async function renderAdminProducts() {
            try {
                const products = await ProductAPI.getAll();
                const tbody = document.getElementById('admin-products-table');
                tbody.innerHTML = products.map(p => `
                    <tr>
                        <td>#${p.id}</td>
                        <td><img src="${p.image}" style="width:50px;height:50px;object-fit:cover;border-radius:4px;" onerror="this.src='images/product-placeholder.jpg'"></td>
                        <td><strong>${p.name}</strong></td>
                        <td><span class="badge badge-${p.category}">${p.category}</span></td>
                        <td>₹${p.price.toLocaleString()}</td>
                        <td>${p.stock}</td>
                        <td>
                            <button class="admin-btn edit" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
                            <button class="admin-btn delete" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Failed to load products:', err);
            }
        }

        async function editProduct(id) {
            try {
                const products = await ProductAPI.getAll();
                const p = products.find(prod => prod.id === id);
                if (!p) return;
                document.getElementById('edit-product-id').value = p.id;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-category').value = p.category;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('prod-oldprice').value = p.old_price || p.oldPrice;
                document.getElementById('prod-stock').value = p.stock;
                document.getElementById('prod-image').value = p.image;
                document.getElementById('prod-desc').value = p.description || '';
                document.getElementById('form-title').textContent = 'Edit Product';
                document.getElementById('product-form-container').style.display = 'block';
            } catch (err) {
                alert('Error loading product');
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure?')) return;
            try {
                await ProductAPI.delete(id);
                renderAdminProducts();
                updateDashboardStats();
            } catch (err) {
                alert('Error deleting: ' + err.message);
            }
        }

        async function renderAdminOrders() {
            try {
                const orders = await OrderAPI.getAll();
                const tbody = document.getElementById('admin-orders-table');
                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;">No orders yet</td></tr>';
                    return;
                }
                tbody.innerHTML = orders.map(o => {
                    const items = typeof o.items === 'string' ? JSON.parse(o.items) : o.items;
                    const addr = typeof o.delivery_address === 'string' ? JSON.parse(o.delivery_address) : o.delivery_address;
                    return `
                        <tr>
                            <td><strong>${o.order_id || o.id}</strong></td>
                            <td>${o.user_id}</td>
                            <td>${(items || []).length} item(s)</td>
                            <td>₹${(o.total || 0).toLocaleString()}</td>
                            <td>${addr?.city || 'Kolhapur'}, ${addr?.pincode || ''}</td>
                            <td>${new Date(o.created_at || o.createdAt).toLocaleDateString('en-IN')}</td>
                            <td><span class="status-badge status-${(o.status || 'Pending').toLowerCase()}">${o.status || 'Pending'}</span></td>
                            <td>
                                <select onchange="updateOrderStatus('${o.order_id || o.id}', this.value)" style="padding:5px;border-radius:4px;border:1px solid #ddd;">
                                    <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                    <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                    <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('Orders error:', err);
            }
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                await OrderAPI.updateStatus(orderId, newStatus);
                alert(`Order ${orderId} updated to ${newStatus}`);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        updateDashboardStats();
        renderAdminProducts();
    </script>
